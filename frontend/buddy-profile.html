<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Profile - StudyHive</title>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <p>StudyHive</p>
          <span id="sidebar-username">Loading...</span>
        </div>
        <nav class="sidebar-nav">
          <p class="sidebar-section-label">Personal</p>
          <a href="index.html">Dashboard</a>
          <a href="courses.html">Courses</a>
          <a href="tasks.html">Tasks</a>
          <a href="calendar.html">Calendar</a>
          <a href="pomodoro.html">Study</a>
          <a href="profile.html">Profile</a>
          <p class="sidebar-section-label">Community</p>
          <a href="feed.html">Feed</a>
          <a href="groups.html">Groups</a>
          <a href="leaderboard.html">Leaderboard</a>
        </nav>
        <div class="sidebar-streak">
          🔥 <span id="sidebar-streak">0</span> day streak
        </div>
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-avatar" id="sidebar-avatar">?</div>
            <span class="sidebar-username" id="sidebar-name">User</span>
          </div>
          <button class="sidebar-logout" onclick="logout()">Logout</button>
        </div>
      </aside>

      <div class="page-content">
        <a href="profile.html" style="font-size:13px; color:#8B7355; text-decoration:none;">← Back</a>

        <!-- Profile Card -->
        <div class="profile-card" style="margin-top:12px;">
          <div class="profile-banner"></div>
          <div class="profile-header">
            <div class="profile-avatar-wrap">
              <div class="profile-avatar" id="profile-avatar">?</div>
              <div class="profile-streak-badge" id="profile-streak-badge" style="display:none;">
                🔥 <span id="profile-streak">0</span> day streak
              </div>
            </div>
            <div class="profile-name" id="profile-name"></div>
            <div class="profile-username" id="profile-username"></div>
            <button id="follow-btn" class="buddy-btn follow" style="margin-top:12px;"></button>
          </div>
        </div>

        <!-- Locked notice -->
        <div id="locked-card" class="profile-info-card" style="display:none;">
          <div class="buddy-empty" style="padding:0;">🔒 This account is private. Follow to see their stats and badges.</div>
        </div>

        <!-- XP & Level -->
        <div id="xp-card" class="profile-xp-card" style="display:none;">
          <div class="profile-xp-header">
            <div>
              <div class="profile-level-name" id="profile-level">Freshman</div>
              <div class="profile-xp-label">
                <span id="profile-xp">0</span> XP
              </div>
            </div>
            <div class="profile-xp-next" id="profile-xp-next">
              100 XP to next level
            </div>
          </div>
          <div class="profile-xp-bar-bg">
            <div
              class="profile-xp-bar-fill"
              id="profile-xp-fill"
              style="width: 0%"
            ></div>
          </div>
        </div>

        <!-- Badges -->
        <div id="badges-card" class="profile-info-card" style="display:none;">
          <div class="profile-info-title">Badges</div>
          <div class="profile-badges-grid" id="profile-badges-grid"></div>
        </div>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/buddy-profile.js"></script>
    <script src="js/timer-engine.js"></script>
    <script src="js/study-widget.js"></script>
  </body>
</html>
